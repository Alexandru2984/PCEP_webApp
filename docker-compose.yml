services:
  db:
    image: pcep_webapp-postgres:16.15-alpine3.24
    build:
      context: ./docker/postgres
      args:
        POSTGRES_IMAGE: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: pcep_db
    restart: unless-stopped
    user: postgres
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    stop_grace_period: 60s
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
      - /var/run/postgresql:size=16m,mode=3775,uid=70,gid=70,noexec,nosuid,nodev
    env_file:
      - path: .env.db
        required: false
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${PCEP_APP_USER} -d $${PCEP_APP_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PCEP_RELEASE: ${PCEP_RELEASE:-development}
    container_name: pcep_backend
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    stop_grace_period: 45s
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    env_file:
      # Optional so `docker compose config` (CI) works without a .env on disk;
      # in real deploys the file is present and supplies the backend secrets.
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      # Bound to loopback only — system nginx will reverse-proxy from pcep.micutu.com
      - "127.0.0.1:8001:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python - <<'PY'\nimport os\nfrom urllib.request import Request, urlopen\nhost = os.environ.get('DJANGO_ALLOWED_HOSTS', 'localhost').split(',')[0].strip()\nreq = Request('http://127.0.0.1:8000/api/health/', headers={'Host': host, 'X-Forwarded-Proto': 'https', 'X-PCEP-Internal-Healthcheck': '1'})\nwith urlopen(req, timeout=3) as response:\n    raise SystemExit(0 if response.status == 200 else 1)\nPY",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  # One-shot builder for the React app. Not started by `docker compose up`.
  # Run with: make compose-build-frontend (maps the host UID/GID for safe output).
  frontend-builder:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pcep_frontend_build
    profiles:
      - build
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
    name: ${PCEP_POSTGRES_VOLUME:-pcep_webapp_postgres_data}
    external: true
  static_volume:
    name: ${PCEP_STATIC_VOLUME:-pcep_webapp_static_volume}
    external: true
  media_volume:
    name: ${PCEP_MEDIA_VOLUME:-pcep_webapp_media_volume}
    external: true
