version: 2

# Routine update PRs are intentionally paused. Advisory visibility remains enabled,
# while dependency changes are initiated manually and still pass dependency review.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:23"
      timezone: "Europe/Bucharest"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "05:23"
      timezone: "Europe/Bucharest"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    versioning-strategy: "increase"
    # Major framework migrations are planned and tested separately. Dependabot's
    # update-types filter applies only to version updates, not security updates.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      production-minor-patch:
        dependency-type: "production"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      development-minor-patch:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "build"

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "05:23"
      timezone: "Europe/Bucharest"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    # Keep the supported major line patched without allowing a speculative major
    # upgrade to occupy the dependency's only open version-update pull request.
    # Security updates remain eligible regardless of this version-update filter.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      production-minor-patch:
        dependency-type: "production"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      development-minor-patch:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "build"

  # The Docker updater only discovers literal FROM references. Keep every
  # monitored Dockerfile's immutable base in FROM, never behind an ARG.
  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/docker/postgres"
      - "/frontend"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "05:23"
      timezone: "Europe/Bucharest"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # Python's language minor is a compatibility boundary even though the
      # Docker tag is SemVer-shaped. Keep routine updates on the reviewed 3.12
      # line; plan 3.13+ migrations together with CI and dependency validation.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-minor"
    groups:
      container-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "build"
