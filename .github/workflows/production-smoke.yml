name: Production smoke

on:
  workflow_dispatch:
    inputs:
      exercise_alert:
        description: Open a synthetic alert after the real smoke check passes
        required: false
        default: false
        type: boolean

concurrency:
  group: production-smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Public liveness, security and answer secrecy
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.15"

      - name: Check the public production contract
        run: python scripts/production_smoke.py

      - name: Exercise the alert path
        if: ${{ inputs.exercise_alert == true }}
        run: |
          echo 'Synthetic production alert exercise requested.' >&2
          exit 1

  alert:
    name: Open a sanitized production alert
    needs: smoke
    if: ${{ always() && needs.smoke.result == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      issues: write # Create the single sanitized incident issue; no repository writes.
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ALERT_TITLE: "[alert] PCEP production smoke failed"
      ALERT_ASSIGNEE: ${{ github.repository_owner }}

    steps:
      - name: Open one deduplicated issue
        run: |
          issue_number="$(
            gh issue list --state open --limit 100 \
              --search 'PCEP production smoke failed in:title' \
              --json number,title \
              --jq '.[] | select(.title == "[alert] PCEP production smoke failed") | .number' \
              | head -n 1
          )"
          if [[ -n "$issue_number" ]]; then
            gh issue edit "$issue_number" \
              --add-assignee "$ALERT_ASSIGNEE"
            echo "Production alert issue #$issue_number is already open."
            exit 0
          fi
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="@$ALERT_ASSIGNEE is the named responder. The manually requested public production contract failed. Review the private workflow diagnostics and follow the incident-response runbook: $run_url"
          body+=$'\n\nNo response body, learner data, host metadata, or workflow log is copied into this issue.'
          gh issue create \
            --title "$ALERT_TITLE" \
            --body "$body" \
            --assignee "$ALERT_ASSIGNEE"

  recover:
    name: Close a recovered production alert
    needs: smoke
    if: ${{ always() && needs.smoke.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      issues: write # Close only the matching incident issue after verified recovery.
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Close the matching open issue
        run: |
          issue_number="$(
            gh issue list --state open --limit 100 \
              --search 'PCEP production smoke failed in:title' \
              --json number,title \
              --jq '.[] | select(.title == "[alert] PCEP production smoke failed") | .number' \
              | head -n 1
          )"
          if [[ -z "$issue_number" ]]; then
            echo 'No open production alert issue needs recovery.'
            exit 0
          fi
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh issue close "$issue_number" \
            --comment "The complete public production contract recovered: $run_url"
