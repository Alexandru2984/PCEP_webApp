name: Scheduled dependency audit

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: dependency-audit
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.in
            backend/requirements-dev.in
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install hashed audit environment
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r backend/requirements-dev.txt

      - name: Audit production dependencies
        run: python -m pip_audit -r backend/requirements.txt

      - name: Audit development dependencies
        run: python -m pip_audit -r backend/requirements-dev.txt

  node:
    name: Node advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Reproduce dependency tree without package scripts
        run: |
          npm ci --ignore-scripts
          node scripts/check-install-scripts.mjs

      - name: Audit dependencies
        run: |
          npm audit --audit-level=moderate
          npm audit signatures
