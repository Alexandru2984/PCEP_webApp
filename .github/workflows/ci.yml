name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Django + pytest + audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: pcep_test
          POSTGRES_USER: pcep_user
          POSTGRES_PASSWORD: pcep_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pcep_user -d pcep_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-secret-key-not-used-in-production
      DJANGO_DEBUG: "True"
      POSTGRES_DB: pcep_test
      POSTGRES_USER: pcep_user
      POSTGRES_PASSWORD: pcep_pass
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements.lock
            backend/requirements-dev.lock

      - name: Install dependencies
        run: >-
          pip install --require-hashes --only-binary=:all:
          -r requirements-dev.lock

      - name: Audit Python dependencies
        run: |
          python -m pip_audit -r requirements.lock
          python -m pip_audit -r requirements-dev.lock

      - name: Audit question bank
        env:
          DJANGO_SETTINGS_MODULE: pcep_project.test_settings
        run: python manage.py audit_questions --fail-on-warnings

      - name: Run pytest
        env:
          DJANGO_SETTINGS_MODULE: pcep_project.settings
        run: python -m pytest -q

      - name: Django deploy check (production config)
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: a-sufficiently-long-production-secret-key-for-ci-only
          DJANGO_ALLOWED_HOSTS: pcep.example.com
        run: python manage.py check --deploy --fail-level WARNING

  frontend:
    name: Frontend (audit + unit tests + lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: |
          npm audit --audit-level=moderate
          npm audit signatures

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm run test

      - name: Cache pinned Python runtime
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: frontend/public/pyodide
          key: pyodide-${{ hashFiles('frontend/scripts/fetch-pyodide.sh') }}

      - name: Fetch pinned Python runtime
        run: npm run fetch-pyodide

      - name: Build
        env:
          VITE_PCEP_RELEASE: ${{ github.sha }}
        run: npm run build

  e2e:
    name: E2E (Playwright, mocked API)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Cache pinned Python runtime
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: frontend/public/pyodide
          key: pyodide-${{ hashFiles('frontend/scripts/fetch-pyodide.sh') }}

      - name: Fetch pinned Python runtime
        run: npm run fetch-pyodide

      - name: Build
        env:
          VITE_PCEP_RELEASE: ${{ github.sha }}
        run: npm run build

      - name: Run E2E tests
        run: npm run e2e

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  ops:
    name: Ops (compose + Nginx + backend build)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      POSTGRES_DB: pcep_db
      POSTGRES_USER: pcep_user
      POSTGRES_PASSWORD: pcep_pass
      DJANGO_SECRET_KEY: ci-secret-key-not-used-in-production
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: pcep.example.com
      CORS_ALLOWED_ORIGINS: https://pcep.example.com
      PCEP_RELEASE: ${{ github.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Docker Compose config
        run: docker compose config >/dev/null

      - name: Validate hardened PostgreSQL runtime
        run: bash scripts/check_postgres_container.sh

      - name: Scan hardened PostgreSQL image
        run: make audit-db-image

      - name: Validate Nginx vhost in isolation
        run: bash scripts/check_nginx.sh

      - name: Build hardened backend image
        run: docker compose build backend

      - name: Build pinned frontend builder image
        run: docker compose --profile build build frontend-builder

      - name: Run pinned frontend builder
        run: make compose-build-frontend

      - name: Scan backend image for fixable high-severity vulnerabilities
        run: make audit-image
