# Actual production TLS vhost. Requires existing Let's Encrypt certificate,
# shared block-dotfiles.conf and Cloudflare real-IP/origin-guard configuration.
# Install nginx/snippets/pcep-*.conf under /etc/nginx/snippets/ first.
limit_req_zone $binary_remote_addr zone=pcep_admin:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=pcep_api:10m rate=3r/s;
limit_req_zone $binary_remote_addr zone=pcep_analytics:1m rate=1r/s;
log_format pcep_json escape=json '{"time":"$time_iso8601","request_id":"$request_id","method":"$request_method","path":"$uri","status":$status,"duration":$request_time,"upstream_duration":"$upstream_response_time"}';

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pcep.micutu.com;
    ssl_certificate /etc/letsencrypt/live/pcep.micutu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pcep.micutu.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Only verified Cloudflare peers or local tunnel connections reach origins.
    if ($from_cloudflare_origin = 0) { return 403; }
    include snippets/block-dotfiles.conf;
    include snippets/pcep-base-headers.conf;
    server_tokens off;
    client_max_body_size 1M;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/wasm text/css text/plain application/xml image/svg+xml;
    access_log /var/log/nginx/pcep_access.log pcep_json;
    error_log /var/log/nginx/pcep_error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location /static/ {
        alias /var/www/pcep/static/;
        access_log off;
        expires 30d;
        include snippets/pcep-base-headers.conf;
    }
    location /media/ {
        alias /var/www/pcep/media/;
        access_log off;
        include snippets/pcep-base-headers.conf;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
    }
    location /admin/ {
        limit_req zone=pcep_admin burst=10 nodelay;
        limit_req_status 429;
        include snippets/pcep-proxy.conf;
        proxy_pass http://127.0.0.1:8001;
        include snippets/pcep-base-headers.conf;
        # Django admin retains its native scripts and CSRF protections.
    }
    location /api/ {
        client_max_body_size 64k;
        limit_req zone=pcep_api burst=30 nodelay;
        limit_req_status 429;
        include snippets/pcep-proxy.conf;
        proxy_pass http://127.0.0.1:8001;
        proxy_hide_header Cache-Control;
        include snippets/pcep-base-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        error_page 413 = @api_too_large;
        error_page 429 = @api_throttled;
    }
    location @api_too_large {
        default_type application/json;
        include snippets/pcep-base-headers.conf;
        add_header Cache-Control "no-store" always;
        return 413 '{"detail":"Request body is too large."}';
    }
    location @api_throttled {
        default_type application/json;
        include snippets/pcep-base-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "1" always;
        return 429 '{"detail":"Too many requests. Please wait and retry."}';
    }
    # The analytics dashboard and authentication API are not PCEP routes.
    location = /u/script.js {
        limit_except GET { deny all; }
        include snippets/pcep-proxy.conf;
        proxy_pass http://127.0.0.1:3010/script.js;
        proxy_hide_header Content-Security-Policy;
        include snippets/pcep-base-headers.conf;
        include snippets/pcep-csp.conf;
    }
    location = /u/api/send {
        client_max_body_size 16k;
        limit_except POST { deny all; }
        limit_req zone=pcep_analytics burst=5 nodelay;
        limit_req_status 429;
        include snippets/pcep-proxy.conf;
        proxy_pass http://127.0.0.1:3010/api/send;
        proxy_hide_header Content-Security-Policy;
        include snippets/pcep-base-headers.conf;
    }
    location /u/ { return 404; }
    # nginx's default mime.types does not recognize .webmanifest.
    location = /manifest.webmanifest {
        root /var/www/pcep/frontend;
        try_files $uri =404;
        default_type application/manifest+json;
        include snippets/pcep-base-headers.conf;
        include snippets/pcep-csp.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    # Revalidate unversioned entry points; active tabs keep their hashed chunks.
    location = /sw.js {
        root /var/www/pcep/frontend;
        try_files $uri =404;
        include snippets/pcep-base-headers.conf;
        include snippets/pcep-csp.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /py-worker.js {
        root /var/www/pcep/frontend;
        try_files $uri =404;
        include snippets/pcep-base-headers.conf;
        include snippets/pcep-csp.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location @missing_asset {
        include snippets/pcep-base-headers.conf;
        include snippets/pcep-csp.conf;
        add_header Cache-Control "no-store" always;
        return 404;
    }
    location /assets/ {
        root /var/www/pcep/frontend;
        try_files $uri =404;
        include snippets/pcep-base-headers.conf;
        include snippets/pcep-csp.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        error_page 404 = @missing_asset;
    }
    location /pyodide/ {
        root /var/www/pcep/frontend;
        try_files $uri =404;
        include snippets/pcep-base-headers.conf;
        include snippets/pcep-csp.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location /practice/ {
        root /var/www/pcep/seo;
        try_files $uri $uri/index.html =404;
        include snippets/pcep-base-headers.conf;
        include snippets/pcep-csp.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /sitemap.xml {
        root /var/www/pcep/seo;
        default_type application/xml;
        try_files $uri =404;
    }
    location = /robots.txt {
        root /var/www/pcep/seo;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        root /var/www/pcep/frontend;
        try_files $uri $uri/ /index.html;
        include snippets/pcep-base-headers.conf;
        include snippets/pcep-csp.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name pcep.micutu.com;
    include snippets/block-dotfiles.conf;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://pcep.micutu.com$request_uri; }
}
