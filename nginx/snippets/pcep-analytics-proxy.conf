# Analytics is a lower-trust upstream. Never disclose current or future learner
# credentials to it, and never let its response mutate the learner origin.
proxy_set_header Cookie "";
proxy_set_header Authorization "";
proxy_set_header Proxy-Authorization "";
proxy_set_header X-CSRFToken "";
proxy_set_header X-XSRF-TOKEN "";
proxy_hide_header Set-Cookie;
proxy_hide_header WWW-Authenticate;
proxy_hide_header Location;
proxy_hide_header Refresh;
proxy_hide_header Content-Security-Policy;
proxy_ignore_headers X-Accel-Redirect X-Accel-Expires X-Accel-Limit-Rate X-Accel-Buffering X-Accel-Charset Set-Cookie;
