# Python/WASM runs only inside the separate runner origin. Umami is proxied
# same-origin; edge-injected third-party scripts and telemetry stay blocked.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src https://pcep-runner.micutu.com; form-action 'self'; img-src 'self' data:; font-src 'self'; manifest-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;
