# Static, capability-free origin for hostile learner Python. It deliberately has
# no SPA fallback, API proxy, authentication, cookies, uploads or dynamic routes.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pcep-runner.micutu.com;
    # The reviewed certificate contains both PCEP hostnames.
    ssl_certificate /etc/letsencrypt/live/pcep.micutu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pcep.micutu.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($from_cloudflare_origin = 0) { return 403; }
    include snippets/block-dotfiles.conf;
    server_tokens off;
    client_max_body_size 1k;
    client_body_timeout 5s;
    client_header_timeout 10s;
    send_timeout 30s;
    access_log /var/log/nginx/pcep_runner_access.log pcep_json;
    error_log /var/log/nginx/pcep_runner_error.log warn;

    location = /runner.html {
        limit_except GET { deny all; }
        root /var/www/pcep/frontend;
        try_files $uri =404;
        include snippets/pcep-runner-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; object-src 'none'; frame-ancestors https://pcep.micutu.com; form-action 'none'; script-src 'self'; worker-src 'self'; connect-src 'none'" always;
    }
    location = /runner-bridge.js {
        limit_except GET { deny all; }
        root /var/www/pcep/frontend;
        try_files $uri =404;
        include snippets/pcep-runner-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'" always;
    }
    location = /py-worker.js {
        limit_except GET { deny all; }
        root /var/www/pcep/frontend;
        try_files $uri =404;
        include snippets/pcep-runner-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; worker-src 'none'" always;
    }
    location ^~ /pyodide/ {
        limit_except GET { deny all; }
        root /var/www/pcep/frontend;
        try_files $uri =404;
        include snippets/pcep-runner-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'" always;
    }
    location / {
        include snippets/pcep-runner-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name pcep-runner.micutu.com;
    include snippets/block-dotfiles.conf;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://pcep-runner.micutu.com$request_uri; }
}
